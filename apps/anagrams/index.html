<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anagrams · Shreyas Prasad</title>
    <meta name="description" content="A daily word game. Make as many words as you can from seven letters in 60 seconds." />
    <link rel="icon" href="https://shreyasprasad.dev/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <!-- Applies the theme chosen on the site or another app before first paint; see src/theme.ts -->
    <script>
      try {
        const theme = document.cookie.match(/(?:^|;\s*)theme=(light|dark)(?:;|$)/)?.[1];
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Anagrams needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
